# Compiled into the binary, not read at runtime.
#
# These stay pointed at localhost so `tauri dev` works out of the box. A real
# shell variable overrides them, which is how CI builds against production —
# and build.rs refuses any release build that still reaches these values.
[env]
SIQSHIFT_AUTH_URL = "https://ep-tiny-mountain-ay0l41z3.neonauth.c-5.us-east-2.aws.neon.tech/neondb/auth"
SIQSHIFT_API_URL = "http://localhost:3977"
