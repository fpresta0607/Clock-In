name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Proves the deployable image still builds; the platform builds its own.
      - run: docker build -f apps/api/Dockerfile -t clock-in-api:ci .

  # Builds the store packages (Chrome/Edge zip and Firefox variant zip) and
  # keeps them as artifacts for the manual store submissions in DEPLOY.md.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clock-in/browser-extension build
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-store-zips
          path: apps/browser-extension/release/*.zip
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          deps="$RUNNER_TEMP/clock-in-tauri-deps"
          mkdir -p "$deps/lists/partial" "$deps/cache/archives/partial" "$deps/root"
          apt-get update \
            -o "Dir::State::Lists=$deps/lists" \
            -o "Dir::Cache=$deps/cache" \
            -o "Dir::Cache::Archives=$deps/cache/archives"
          apt-get --download-only --yes install \
            -o "Dir::State::Lists=$deps/lists" \
            -o "Dir::Cache=$deps/cache" \
            -o "Dir::Cache::Archives=$deps/cache/archives" \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          while IFS= read -r -d '' package; do
            dpkg-deb -x "$package" "$deps/root"
          done < <(find "$deps/cache/archives" -name '*.deb' -print0)
          echo "PKG_CONFIG_PATH=$deps/root/usr/lib/x86_64-linux-gnu/pkgconfig:$deps/root/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$deps/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "PATH=$deps/root/usr/bin:$PATH" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
