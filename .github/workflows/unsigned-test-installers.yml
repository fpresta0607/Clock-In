name: Unsigned test installers

# Builds desktop installers with NO signing, uploads them as workflow-run
# artifacts, and (on a deliberate `workflow_dispatch` only) republishes the
# `unsigned-latest` release so the website has something anonymous visitors
# can actually download.
#
# Why a release and not the run artifact: GitHub requires authentication to
# download a workflow artifact, so a raw artifact URL is useless to a signed-out
# visitor. Release assets are public on a public repo. The tag is fixed and the
# asset names are fixed, so `releases/download/unsigned-latest/<asset>` is a
# permanent URL that always serves the newest run's output. The web dashboard
# hard-codes exactly that URL; see `apps/web/src/DownloadInstaller.tsx`.
#
# This is deliberately NOT a relaxation of `release.yml`. That workflow still
# refuses to publish anything unsigned, and nothing here touches it. The two
# paths differ in what they build:
#
#   release.yml            cargo/tauri *release* build. `build.rs` treats a
#                          release build as a production artifact and demands
#                          the updater key plus platform signing credentials.
#   this workflow          tauri *debug* build (`tauri build --debug`), which
#                          `build.rs` already classifies as a development
#                          build: no signing credentials, and
#                          `bundle.createUpdaterArtifacts` must stay off.
#
# So the signing gate is honoured rather than bypassed, and adding Azure
# Trusted Signing later only touches `release.yml` and the signing config.
# Nothing in this file has to change for that.

on:
  # Once this file is on the default branch: Actions -> Unsigned test
  # installers -> Run workflow (any branch).
  workflow_dispatch:
  # workflow_dispatch only exists for workflows already on the default branch,
  # so this prefix is how you exercise the workflow from a branch before it
  # merges: push to `unsigned-test/anything`.
  push:
    branches: ["unsigned-test/**"]

# Read-only by default, so the build job cannot publish anything even by
# mistake. Only the small `publish` job below widens this, and it builds
# nothing.
permissions:
  contents: read

concurrency:
  group: unsigned-test-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS only: WiX's light.exe fails to bundle the unoptimized debug
          # binary into an MSI. The NSIS setup .exe is the installer to run.
          - os: windows-latest
            target: windows
            bundle_args: "--bundles nsis"
          # macOS bundles cleanly unsigned with the configured targets (.app
          # and .dmg), so it takes no override.
          - os: macos-latest
            target: macos
            bundle_args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Job-level so the helper build and the bundle build see identical values;
    # `build.rs` reruns on any change to these, and a mismatch between the two
    # steps would recompile the whole crate. These are the same public
    # repository variables the release workflow bakes in, so the test build
    # talks to the real API instead of localhost.
    env:
      CLOCK_IN_AUTH_URL: ${{ vars.CLOCK_IN_AUTH_URL }}
      CLOCK_IN_API_URL: ${{ vars.CLOCK_IN_API_URL }}
      CLOCK_IN_CHROME_EXTENSION_ID: ${{ vars.CLOCK_IN_CHROME_EXTENSION_ID }}
      CLOCK_IN_EDGE_EXTENSION_ID: ${{ vars.CLOCK_IN_EDGE_EXTENSION_ID }}
      CLOCK_IN_FIREFOX_EXTENSION_ID: ${{ vars.CLOCK_IN_FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: unsigned-test
      - run: pnpm install --frozen-lockfile

      - name: Build the hook helper
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin clock-in-hook

      - name: Build the browser host helper
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin clock-in-browser-host

      # `externalBin` resolves `binaries/<name>-<target-triple>`, so the helpers
      # have to sit there under that name before the bundler runs. Same staging
      # rule as the release workflow, minus the signing.
      - name: Stage the helpers for bundling
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          suffix=""
          if [ "${{ matrix.target }}" = windows ]; then
            suffix=".exe"
          fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "apps/desktop/src-tauri/target/debug/clock-in-hook$suffix" \
            "apps/desktop/src-tauri/binaries/clock-in-hook-$triple$suffix"
          cp "apps/desktop/src-tauri/target/debug/clock-in-browser-host$suffix" \
            "apps/desktop/src-tauri/binaries/clock-in-browser-host-$triple$suffix"

      # The updater only offers a build whose semver is strictly higher than
      # the installed one, so every run needs its own version. `run_number`
      # only ever increases, and numeric prerelease identifiers compare
      # numerically, so `-test.9` correctly precedes `-test.10`. A test build
      # also loses to the eventual signed release, which is what we want.
      - name: Stamp this run's version
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = `${config.version}-test.${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
            console.log(`stamped ${config.version}`);
          '

      # --debug is what keeps this build outside the production signing gate.
      # Still no TAURI_CONFIG override, so `bundle.createUpdaterArtifacts`
      # stays off and `build.rs` keeps refusing updater artifacts from an
      # unsigned build. The updater signature is produced separately below,
      # from the finished installer, so this gate is never touched.
      - name: Build unsigned installers
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug ${{ matrix.bundle_args }}

      # The updater verifies a detached minisign signature over the installer
      # bytes. `tauri signer sign` produces exactly what
      # `bundle.createUpdaterArtifacts` would have, without asking the bundler
      # for it, so the production signing gate stays shut. Windows only: the
      # macOS updater wants a `.app.tar.gz`, not the `.dmg` this job builds,
      # so offering a macOS update here would hand the updater something it
      # cannot install.
      - name: Sign the Windows installer for the updater
        if: matrix.target == 'windows'
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured; the build would ship an unupdatable installer." >&2
            exit 1
          fi
          installer="$(find src-tauri/target/debug/bundle -type f -name '*-setup.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo "No NSIS installer to sign" >&2
            find src-tauri/target/debug/bundle -maxdepth 3 >&2 || true
            exit 1
          fi
          pnpm exec tauri signer sign --password "" "$installer"
          test -s "$installer.sig"

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          out=unsigned-artifacts
          bundle=apps/desktop/src-tauri/target/debug/bundle
          mkdir -p "$out"
          found=0
          while IFS= read -r -d '' installer; do
            cp "$installer" "$out/UNSIGNED-TEST-$(basename "$installer")"
            found=1
          done < <(find "$bundle" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          # The updater signature travels beside its installer, under the same
          # renamed prefix, so the publish job can pair them without guessing.
          while IFS= read -r -d '' signature; do
            cp "$signature" "$out/UNSIGNED-TEST-$(basename "$signature")"
          done < <(find "$bundle" -type f -name '*.sig' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No installer was produced under $bundle" >&2
            find "$bundle" -maxdepth 2 >&2 || true
            exit 1
          fi
          cat > "$out/UNSIGNED-TEST-BUILD.txt" <<EOF
          Clock-In unsigned test build
          ============================

          These installers are NOT code signed and are NOT a release. They come
          from ${{ github.repository }} run ${{ github.run_id }}, commit
          ${{ github.sha }}.

          What that means:
            * Windows SmartScreen will warn about an unknown publisher.
            * On Windows this build updates itself: it checks for a newer
              build at launch and every six hours, installs it quietly, and
              restarts. A copy installed before the updater shipped cannot,
              because its binary has no updater in it.
            * macOS still updates by hand.
            * It is a debug build, so it is larger and slower than a release
              build.

          Until code signing exists, this is what clock.siqstack.com hands out.
          Signed installers will come from the tagged release workflow only.
          EOF
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-TEST-BUILD-${{ matrix.target }}-${{ github.run_number }}
          path: unsigned-artifacts/*
          if-no-files-found: error

  publish:
    # A `unsigned-test/**` push is someone exercising a change to this file, so
    # it must not overwrite what the website hands out. Only a deliberate
    # "Run workflow" republishes the public download.
    if: github.event_name == 'workflow_dispatch'
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only place in this workflow that can write to the repository, and it
    # compiles nothing: it renames what `installers` already produced and
    # uploads it. The signing gate lives in `release.yml` and is untouched.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: unsigned-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # Fixed names are the whole point: the website links
      # releases/download/unsigned-latest/<these names> as a constant, with no
      # GitHub API lookup and nothing to update when the version changes. The
      # version travels in the release title, the notes, and the app itself.
      - name: Stage the release assets under their permanent names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          take() {
            local pattern="$1" name="$2"
            local found
            found="$(find downloaded -type f -name "$pattern" -print -quit)"
            if [ -z "$found" ]; then
              echo "No artifact matched $pattern" >&2
              find downloaded -type f >&2
              exit 1
            fi
            cp "$found" "release-assets/$name"
          }
          take '*.exe' Clock-In-UNSIGNED-TEST-windows-x64-setup.exe
          take '*.dmg' Clock-In-UNSIGNED-TEST-macos-aarch64.dmg
          take '*.exe.sig' Clock-In-UNSIGNED-TEST-windows-x64-setup.exe.sig
          # Both matrix legs write an identical one, so either will do.
          take 'UNSIGNED-TEST-BUILD.txt' UNSIGNED-TEST-BUILD.txt
          ls -l release-assets

      # The manifest the installed app polls. It lives at the same fixed
      # `unsigned-latest` names as the installers, so an installed build's
      # endpoint never has to change and no API lookup is involved.
      #
      # Windows only, deliberately: the macOS updater installs from a
      # `.app.tar.gz`, and this workflow ships a `.dmg`. Listing `darwin` here
      # would advertise an update the updater cannot apply.
      - name: Write the update manifest
        shell: bash
        env:
          BASE_URL: "${{ github.server_url }}/${{ github.repository }}/releases/download/unsigned-latest"
          INSTALLER_NAME: Clock-In-UNSIGNED-TEST-windows-x64-setup.exe
          SIGNATURE_PATH: release-assets/Clock-In-UNSIGNED-TEST-windows-x64-setup.exe.sig
          MANIFEST_PATH: release-assets/latest.json
        run: |
          set -euo pipefail
          # This checkout carries the unstamped version, so the same `-test.N`
          # suffix the build stamped is reapplied from the same run number.
          export VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")-test.${{ github.run_number }}"
          node scripts/updater-manifest.mjs

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")-test.${{ github.run_number }}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cat > release-notes.md <<EOF
          Unsigned test build of Clock-In **$version**, from commit
          \`${{ github.sha }}\` (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          These installers are **not code signed**. Windows SmartScreen will warn
          about an unknown publisher: choose **More info**, then **Run anyway**.
          macOS is un-notarized and needs
          \`xattr -dr com.apple.quarantine "/Applications/Clock-In.app"\`.

          They are debug builds, so they are larger and slower than a release
          build.

          **Windows updates itself from here.** Once a build carrying the
          updater is installed, Clock-In checks this manifest at launch and
          every six hours, installs a newer build quietly, and restarts into
          it. Nothing to click, and a machine that is offline simply checks
          again later. A copy installed *before* the updater shipped cannot
          update itself, because its binary has no updater in it: install this
          build once by hand and every build after it is automatic. macOS still
          updates by hand, because the updater installs from an app archive
          rather than the `.dmg` this workflow builds.

          This tag and these file names never change. Every run of the *Unsigned
          test installers* workflow replaces the assets in place, so the links
          below always point at the newest build, and so does the **Download for
          Windows** button on clock.siqstack.com.
          EOF

      # Force the tag onto this commit so the release stops claiming to be
      # whatever commit first created it.
      - name: Move the unsigned-latest tag to this commit
        run: git push --force origin "HEAD:refs/tags/$TAG"

      # Edit-or-create, never delete-and-recreate: deleting would leave the
      # published download URL 404ing for the length of the upload.
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          title="Unsigned test build $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md \
              --prerelease=false --target "${{ github.sha }}"
          else
            gh release create "$TAG" --title "$title" --notes-file release-notes.md \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
