name: Release desktop

# Tag a release to publish installers:  git tag v0.1.0 && git push origin v0.1.0
#
# Production releases require installer and updater signing credentials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Verify production signing configuration
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          if [ "${{ matrix.target }}" = windows ]; then
            if [ -z "$WINDOWS_CERTIFICATE" ] && [ -z "$WINDOWS_CERTIFICATE_THUMBPRINT" ]; then
              missing+=(WINDOWS_CERTIFICATE-or-WINDOWS_CERTIFICATE_THUMBPRINT)
            fi
            if [ -n "$WINDOWS_CERTIFICATE" ] && [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
              missing+=(WINDOWS_CERTIFICATE_PASSWORD)
            fi
          else
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Refusing to publish an unsigned or non-updatable production release. Configure: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # tauri-action signs the app binary and the installers itself, but the
      # helper binaries (clock-in-hook, clock-in-browser-host) are ours to
      # sign. Build them first and sign them with the same certificate; the
      # subsequent tauri-action build reuses the untouched cargo artifacts,
      # so the signed binaries are what end up in the installer. The build is
      # unconditional: both helpers ship inside the installer as externalBin
      # siblings of the app.
      # TAURI_CONFIG neutralizes bundle.externalBin for this step only:
      # tauri-build would otherwise try to copy binaries/<name>-<triple>,
      # which does not exist until the staging steps below run.
      - name: Prepare Windows signing identity
        id: windows_signing
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'clock-in-codesign.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
              $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
                Where-Object { $_.HasPrivateKey } |
                Select-Object -First 1
            } finally {
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            }
          } else {
            $certificate = Get-ChildItem Cert:\CurrentUser\My |
              Where-Object { $_.Thumbprint -eq $env:WINDOWS_CERTIFICATE_THUMBPRINT } |
              Select-Object -First 1
          }
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
            throw 'The configured Windows code-signing certificate is unavailable or lacks a private key.'
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Prepare macOS signing identity
        id: macos_signing
        if: matrix.target == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/clock-in-release.keychain-db"
          certificate="$RUNNER_TEMP/clock-in-release.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          rm -f "$certificate"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/{print $2; exit}')"
          [ -n "$identity" ]
          [ "$identity" = "$APPLE_SIGNING_IDENTITY" ]
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Build helper binaries
        shell: bash
        env:
          CLOCK_IN_AUTH_URL: ${{ vars.CLOCK_IN_AUTH_URL }}
          CLOCK_IN_API_URL: ${{ vars.CLOCK_IN_API_URL }}
          CLOCK_IN_CHROME_EXTENSION_ID: ${{ vars.CLOCK_IN_CHROME_EXTENSION_ID }}
          CLOCK_IN_EDGE_EXTENSION_ID: ${{ vars.CLOCK_IN_EDGE_EXTENSION_ID }}
          CLOCK_IN_FIREFOX_EXTENSION_ID: ${{ vars.CLOCK_IN_FIREFOX_EXTENSION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLOCK_IN_RELEASE_TARGET: ${{ matrix.target }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          TAURI_CONFIG="$(node -e '
            const bundle = { externalBin: [] };
            if (process.env.CLOCK_IN_RELEASE_TARGET === "windows") {
              bundle.windows = {
                certificateThumbprint: process.env.WINDOWS_CERTIFICATE_THUMBPRINT,
                digestAlgorithm: "sha256",
                timestampUrl: process.env.WINDOWS_TIMESTAMP_URL || "http://timestamp.digicert.com",
              };
            }
            process.stdout.write(JSON.stringify({ bundle }));
          ')" cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Sign helper binaries (Authenticode)
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { $_.VersionInfo.ProductVersion } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $ts = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $certArgs = @('/sha1', $env:WINDOWS_CERTIFICATE_THUMBPRINT)
          foreach ($bin in 'clock-in-hook.exe', 'clock-in-browser-host.exe') {
            $path = Join-Path 'apps/desktop/src-tauri/target/release' $bin
            & $signtool sign /fd sha256 /td sha256 /tr $ts @certArgs $path
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $bin" }
          }

      # externalBin resolves `binaries/<name>-<target-triple>`; stage the
      # (signed, on Windows) helpers under those names for the bundler.
      - name: Stage helper binaries for bundling (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'apps/desktop/src-tauri/binaries' | Out-Null
          foreach ($bin in 'clock-in-hook', 'clock-in-browser-host') {
            Copy-Item "apps/desktop/src-tauri/target/release/$bin.exe" "apps/desktop/src-tauri/binaries/$bin-x86_64-pc-windows-msvc.exe" -Force
          }

      - name: Stage helper binaries for bundling (macOS)
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/binaries
          for bin in clock-in-hook clock-in-browser-host; do
            cp "apps/desktop/src-tauri/target/release/$bin" "apps/desktop/src-tauri/binaries/$bin-aarch64-apple-darwin"
          done

      - name: Create Tauri bundle configuration
        id: tauri_config
        env:
          CLOCK_IN_UPDATER_ENABLED: "true"
          CLOCK_IN_WINDOWS_SIGNING: ${{ matrix.target == 'windows' && 'true' || 'false' }}
          CLOCK_IN_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/release-tauri-config.mjs

      # These are read at compile time, so they must be set before the build.
      # Without them the installer ships pointing at localhost.
      - uses: tauri-apps/tauri-action@v0
        env:
          CLOCK_IN_AUTH_URL: ${{ vars.CLOCK_IN_AUTH_URL }}
          CLOCK_IN_API_URL: ${{ vars.CLOCK_IN_API_URL }}
          CLOCK_IN_CHROME_EXTENSION_ID: ${{ vars.CLOCK_IN_CHROME_EXTENSION_ID }}
          CLOCK_IN_EDGE_EXTENSION_ID: ${{ vars.CLOCK_IN_EDGE_EXTENSION_ID }}
          CLOCK_IN_FIREFOX_EXTENSION_ID: ${{ vars.CLOCK_IN_FIREFOX_EXTENSION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_CONFIG: ${{ steps.tauri_config.outputs.config }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing. Together with the createUpdaterArtifacts override
          # above, tauri-action publishes the .sig files and latest.json
          # beside the installers, which the in-app updater verifies against.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Clock-In ${{ github.ref_name }}
          # Published (not draft) so the web app's download links work immediately.
          releaseDraft: false
          # A hyphen in the tag (v0.2.0-rc.1) marks a prerelease, so the
          # updater's latest-release endpoint never ships an RC to installs.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Ship the helper binaries beside the installers as well, for anyone
      # who needs them outside the installer (managed fleets, debugging).
      - name: Publish helper binaries to the release
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive `
            -Path 'apps/desktop/src-tauri/target/release/clock-in-hook.exe', 'apps/desktop/src-tauri/target/release/clock-in-browser-host.exe' `
            -DestinationPath 'clock-in-helpers-windows.zip' -Force
          gh release upload $env:GITHUB_REF_NAME 'clock-in-helpers-windows.zip' --clobber
